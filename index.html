<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1e293b">
  <link rel="manifest" href="manifest.json">
  <title>英語学習</title>
  <style>
    :root {
      --primary: #818cf8;
      --primary-hover: #6366f1;
      --accent: #22d3ee;
      --bg: #0f172a;
      --surface: #1e293b;
      --surface2: #0d1424;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --border: #334155;
      --radius: 10px;
      --shadow: 0 4px 20px rgba(0,0,0,0.5);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    button { touch-action: manipulation; }

    body {
      font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100dvh;
      overflow: hidden;
    }

    /* ── Header ── */
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 10px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    header h1 {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--text);
      white-space: nowrap;
    }

    .mode-tabs {
      display: flex;
      gap: 6px;
      margin-left: auto;
      align-items: center;
    }

    .mode-tab {
      padding: 6px 14px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text-muted);
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
    }

    .mode-tab.active {
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
    }

    .mode-tab:hover:not(.active) {
      border-color: var(--primary);
      color: var(--primary);
    }

    /* ── Quiz / Learn type dropdown ── */
    .quiz-tab-wrap, .learn-tab-wrap { position: relative; }

    .quiz-drop, .learn-drop {
      display: none;
      position: absolute;
      top: calc(100% + 8px);
      right: 0;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 6px;
      min-width: 150px;
      z-index: 200;
      box-shadow: 0 8px 28px rgba(0,0,0,0.6);
      flex-direction: column;
      gap: 2px;
    }

    .quiz-drop.open, .learn-drop.open { display: flex; }

    .quiz-drop button, .learn-drop button {
      padding: 8px 12px;
      border-radius: 7px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      text-align: left;
      transition: all 0.15s;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .quiz-drop button:hover, .learn-drop button:hover { background: var(--surface2); color: var(--text); }
    .quiz-drop button.selected, .learn-drop button.selected { color: var(--primary); }
    .quiz-drop button.selected::before, .learn-drop button.selected::before { content: '✓'; font-weight: 700; }
    .quiz-drop button:not(.selected)::before, .learn-drop button:not(.selected)::before { content: ''; display: inline-block; width: 0.9em; }

    /* ── Big next button ── */
    .next-big-btn {
      width: 100%;
      padding: 15px;
      border-radius: var(--radius);
      background: var(--primary);
      color: #fff;
      border: none;
      font-size: 1.05rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
    }
    .next-big-btn:hover { background: var(--primary-hover); }

    /* ── Learn bottom row (prev | next-big | next) ── */
    .learn-bottom-row {
      display: flex;
      align-items: stretch;
      gap: 8px;
    }
    .learn-bottom-row .next-big-btn {
      flex: 1;
      width: auto;
    }
    .learn-bottom-row .nav-btn {
      padding: 8px 14px;
      font-size: 0.78rem;
      flex-shrink: 0;
    }
    .learn-bottom-row.seq-mode .nav-btn {
      flex: 1;
      padding: 10px 14px;
      font-size: 0.9rem;
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }
    .learn-bottom-row.seq-mode .nav-btn:hover { background: var(--primary-hover); border-color: var(--primary-hover); color: #fff; }
    .next-big-btn:active { transform: scale(0.98); }

    .nav-btn:disabled { opacity: 0.25; cursor: not-allowed; pointer-events: none; }

    /* ── Main ── */
    main { max-width: 720px; margin: 0 auto; padding: 18px 16px 120px; }

    /* ── Fixed bottom bar ── */
    .bottom-bar {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: var(--bg);
      border-top: 1px solid var(--border);
      padding: 10px 16px 18px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      z-index: 100;
    }

    /* ── Filter bar ── */
    .filter-bar {
      display: flex;
      gap: 6px;
      margin-bottom: 12px;
      justify-content: center;
    }

    .filter-btn {
      padding: 5px 16px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text-muted);
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .filter-btn.active {
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
    }

    /* ── Nav row ── */
    .card-wrapper, .quiz-wrapper { display: flex; flex-direction: column; gap: 10px; }

    .nav-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .nav-btn {
      padding: 8px 16px;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-muted);
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
    }

    .nav-btn:hover { border-color: var(--primary); color: var(--primary); }

    /* ── Jump-to row (sequential mode) ── */
    .jump-row {
      display: none;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .jump-label { font-size: 0.78rem; color: var(--text-muted); white-space: nowrap; }

    .jump-input {
      width: 64px;
      padding: 5px 8px;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-size: 0.85rem;
      text-align: center;
    }

    .jump-input:focus { outline: none; border-color: var(--primary); }
    .jump-input::-webkit-inner-spin-button,
    .jump-input::-webkit-outer-spin-button { opacity: 0.4; }

    .jump-btn {
      padding: 5px 14px;
      border-radius: var(--radius);
      border: none;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text-muted);
      font-size: 0.78rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
    }

    .jump-btn:hover { border-color: var(--primary); color: var(--primary); }

    .random-btn {
      padding: 8px 22px;
      border-radius: var(--radius);
      background: var(--primary);
      color: #fff;
      border: none;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
    }

    .random-btn:hover { background: var(--primary-hover); }
    .random-btn:active { transform: scale(0.98); }

    /* ── Learn card ── */
    .card {
      background: var(--surface);
      border-radius: 14px;
      box-shadow: var(--shadow);
      padding: 22px 26px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      animation: fadeIn 0.25s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(5px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .card-type-badge {
      display: inline-block;
      padding: 2px 10px;
      border-radius: 999px;
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.04em;
    }

    .badge-word   { background: #312e81; color: #a5b4fc; }
    .badge-phrase { background: #164e63; color: #67e8f9; }

    /* ── Frequency ── */
    .freq-wrap { display: flex; align-items: center; gap: 6px; }
    .freq-label { font-size: 0.68rem; color: var(--text-muted); white-space: nowrap; }
    .freq-dots { display: flex; gap: 3px; }
    .freq-dot {
      width: 10px; height: 10px;
      border-radius: 3px;
      background: var(--border);
    }
    .freq-dot.on { background: var(--accent); }

    .card-en {
      font-size: 1.75rem;
      font-weight: 800;
      color: var(--primary);
      line-height: 1.2;
    }

    .card-phonetic {
      font-size: 0.85rem;
      color: var(--text-muted);
      font-style: italic;
      margin-top: 2px;
    }

    .divider { height: 1px; background: var(--border); }

    .card-pos  { font-size: 0.78rem; color: var(--text-muted); margin-bottom: 2px; }
    .card-ja   { font-size: 1.05rem; font-weight: 700; color: var(--text); }

    .card-example {
      background: var(--surface2);
      border-left: 3px solid var(--accent);
      border-radius: 0 8px 8px 0;
      padding: 10px 14px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .card-example .en { font-size: 0.86rem; color: var(--text); font-style: italic; }
    .card-example .ja { font-size: 0.8rem; color: var(--text-muted); }

    .card-counter { text-align: center; font-size: 0.73rem; color: var(--text-muted); }

    /* ── Quiz flip card ── */
    .flip-scene {
      perspective: 1000px;
      animation: fadeIn 0.25s ease;
    }

    .flip-inner {
      display: grid;
      transition: transform 0.52s cubic-bezier(0.4, 0, 0.2, 1);
      transform-style: preserve-3d;
    }

    .flip-front,
    .flip-back {
      grid-area: 1 / 1;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      background: var(--surface);
      border-radius: 14px;
      box-shadow: var(--shadow);
      padding: 22px 26px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .flip-back {
      transform: rotateY(180deg);
      background: #081c12;
      border: 1px solid #166534;
    }

    .flip-inner.flipped { transform: rotateY(180deg); }

    .quiz-question-label {
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    .quiz-question {
      font-size: 1.35rem;
      font-weight: 800;
      color: var(--text);
      line-height: 1.35;
    }

    .quiz-question .blank {
      display: inline-block;
      min-width: 90px;
      border-bottom: 2px solid var(--primary);
      background: #1e2d4a;
      border-radius: 4px;
      padding: 0 8px;
      color: transparent;
    }

    .flip-front,
    .flip-back { cursor: pointer; user-select: none; }

    .flip-hint {
      margin-top: auto;
      font-size: 0.7rem;
      color: var(--text-muted);
      text-align: right;
      opacity: 0.6;
    }

    .answer-label {
      font-size: 0.68rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: #4ade80;
    }

    .answer-main { font-size: 1.35rem; font-weight: 800; color: var(--text); line-height: 1.3; }
    .answer-sub  { font-size: 0.82rem; color: var(--text-muted); font-style: italic; }

    .quiz-counter { text-align: center; font-size: 0.73rem; color: var(--text-muted); }

    .section-hidden { display: none !important; }
  </style>
</head>
<body>

<header>
  <h1>📚 英語学習</h1>
  <div class="mode-tabs">
    <div class="learn-tab-wrap" id="learn-tab-wrap">
      <button class="mode-tab active" id="tab-learn" onclick="toggleLearnDrop()">学習モード ▾</button>
      <div class="learn-drop" id="learn-drop">
        <button id="drop-learn-random" class="selected" onclick="pickLearnMode('random')">ランダム</button>
        <button id="drop-learn-seq"                     onclick="pickLearnMode('seq')">順番</button>
      </div>
    </div>
    <div class="quiz-tab-wrap" id="quiz-tab-wrap">
      <button class="mode-tab" id="tab-quiz" onclick="toggleQuizDrop()">クイズモード ▾</button>
      <div class="quiz-drop" id="quiz-drop">
        <button id="drop-en-ja" onclick="pickQuizType('en-ja')">英語 → 日本語</button>
        <button id="drop-ja-en" onclick="pickQuizType('ja-en')">日本語 → 英語</button>
        <button id="drop-blank"  onclick="pickQuizType('blank')">穴あき問題</button>
      </div>
    </div>
  </div>
</header>

<main>

  <!-- ─── LEARNING MODE ─── -->
  <section id="learn-section">
    <div class="filter-bar">
      <button class="filter-btn active" onclick="setFilter('all', this)">すべて</button>
      <button class="filter-btn" onclick="setFilter('word', this)">単語</button>
      <button class="filter-btn" onclick="setFilter('phrase', this)">熟語</button>
    </div>

    <div class="card-wrapper">
      <div class="card" id="learn-card"></div>
      <div class="card-counter" id="card-counter"></div>
    </div>
  </section>

  <!-- ─── QUIZ MODE ─── -->
  <section id="quiz-section" class="section-hidden">
    <div class="filter-bar">
      <button class="filter-btn active" onclick="setQuizFilter('all', this)">すべて</button>
      <button class="filter-btn" onclick="setQuizFilter('word', this)">単語</button>
      <button class="filter-btn" onclick="setQuizFilter('phrase', this)">熟語</button>
    </div>

    <div class="quiz-wrapper">
      <div class="nav-row">
        <button class="nav-btn" id="quiz-prev" onclick="navigateQuiz(-1)" disabled>◀ 前へ</button>
        <button class="nav-btn" id="quiz-next-nav" onclick="navigateQuiz(1)" disabled>次へ ▶</button>
      </div>
      <div class="flip-scene">
        <div class="flip-inner" id="flip-inner">
          <div class="flip-front" onclick="toggleFlip()">
            <div class="card-header" id="quiz-card-header"></div>
            <div class="quiz-question-label" id="quiz-label"></div>
            <div class="quiz-question" id="quiz-question"></div>
            <div class="flip-hint">タップして回答を確認 →</div>
          </div>
          <div class="flip-back" onclick="toggleFlip()">
            <div class="answer-label">正解</div>
            <div class="answer-main" id="answer-main"></div>
            <div class="divider"></div>
            <div class="answer-sub" id="answer-sub"></div>
            <div class="flip-hint">← タップして問題に戻る</div>
          </div>
        </div>
      </div>
      <div class="quiz-counter" id="quiz-counter"></div>

    </div>
  </section>

</main>

<!-- ── Fixed bottom bars ── -->
<div class="bottom-bar" id="bottom-bar-learn">
  <div class="learn-bottom-row">
    <button class="nav-btn" id="learn-prev" onclick="navigateLearn(-1)" disabled>◀ 戻る</button>
    <button class="next-big-btn" id="learn-next-big" onclick="goLearnNext()">🔀 ランダム表示</button>
    <button class="nav-btn" id="learn-next-nav" onclick="navigateLearn(1)" disabled>進む ▶</button>
  </div>
  <div class="jump-row" id="jump-row">
    <span class="jump-label">番号指定</span>
    <input type="number" id="jump-input" class="jump-input" min="1"
           onkeydown="if(event.key==='Enter') jumpToSeq()">
    <button class="jump-btn" onclick="jumpToSeq()">移動</button>
  </div>
</div>
<div class="bottom-bar section-hidden" id="bottom-bar-quiz">
  <button class="next-big-btn" onclick="goQuizNext()">次の問題 ▶</button>
</div>

<script>
  // ─── Data ────────────────────────────────────────────────────
  // freq: 1(rare)〜5(very common)
  const words = [
    { type:'word', en:'eloquent',     phonetic:'/ˈɛləkwənt/',         pos:'形容詞', freq:3, ja:'雄弁な、説得力のある',
      example:{ en:'She gave an eloquent speech that moved the entire audience.', ja:'彼女は聴衆全員を感動させる雄弁なスピーチをした。' } },
    { type:'word', en:'perseverance', phonetic:'/ˌpɜːrsɪˈvɪərəns/',   pos:'名詞',   freq:4, ja:'忍耐力、粘り強さ',
      example:{ en:'His perseverance helped him overcome every obstacle.', ja:'彼の忍耐力はあらゆる障害を乗り越える助けになった。' } },

      example:{ en:'The instructions were ambiguous and hard to follow.', ja:'説明が曖昧でわかりにくかった。' } },
    { type:'word', en:'meticulous',   phonetic:'/mɪˈtɪkjʊləs/',        pos:'形容詞', freq:3, ja:'細心の、几帳面な',
      example:{ en:'She is meticulous about checking every detail of her work.', ja:'彼女は仕事の細部まで細心の注意を払って確認する。' } },
    { type:'word', en:'resilient',    phonetic:'/rɪˈzɪliənt/',          pos:'形容詞', freq:4, ja:'回復力のある、しなやかな',
      example:{ en:'Children are often more resilient than we expect.', ja:'子どもたちは私たちが思う以上に回復力がある。' } },
    { type:'word', en:'pragmatic',    phonetic:'/præɡˈmætɪk/',          pos:'形容詞', freq:3, ja:'実用的な、現実的な',
      example:{ en:'We need a pragmatic solution, not an idealistic one.', ja:'理想的ではなく現実的な解決策が必要だ。' } },
    { type:'word', en:'ephemeral',    phonetic:'/ɪˈfɛmərəl/',           pos:'形容詞', freq:2, ja:'はかない、短命の',

    { type:'word', en:'benevolent',   phonetic:'/bɪˈnɛvələnt/',         pos:'形容詞', freq:2, ja:'慈悲深い、善意の',

    { type:'word', en:'tenacious',    phonetic:'/tɪˈneɪʃəs/',           pos:'形容詞', freq:3, ja:'粘り強い、固執する',
      example:{ en:'The tenacious athlete never gave up, even after losing.', ja:'粘り強いアスリートは負けた後でも決して諦めなかった。' } },
    { type:'phrase', en:'break the ice',                pos:'慣用句', freq:5, ja:'緊張をほぐす、話のきっかけを作る',

    { type:'phrase', en:'spill the beans',              pos:'慣用句', freq:4, ja:'秘密を漏らす、うっかり話してしまう',

    { type:'phrase', en:'cost an arm and a leg',        pos:'慣用句', freq:5, ja:'非常に高価、目が飛び出るほど高い',

    { type:'phrase', en:'the ball is in your court',    pos:'慣用句', freq:3, ja:'あなた次第だ、あなたが決める番だ',

    { type:'phrase', en:'burn the midnight oil',        pos:'慣用句', freq:4, ja:'夜遅くまで働く、徹夜で勉強する',

  // ─── Utility ─────────────────────────────────────────────────
  function filtered(f) { return f === 'all' ? words : words.filter(w => w.type === f); }

  function shuffled(arr) {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function freqDots(freq) {
    return Array.from({length: 5}, (_, i) =>
      `<span class="freq-dot${i < freq ? ' on' : ''}"></span>`
    ).join('');
  }

  // ─── Mode switching ───────────────────────────────────────────
  function switchMode(m) {
    mode = m;
    document.getElementById('learn-section').classList.toggle('section-hidden', m !== 'learn');
    document.getElementById('quiz-section').classList.toggle('section-hidden', m !== 'quiz');
    document.getElementById('tab-learn').classList.toggle('active', m === 'learn');
    document.getElementById('tab-quiz').classList.toggle('active', m === 'quiz');
    document.getElementById('bottom-bar-learn').classList.toggle('section-hidden', m !== 'learn');
    document.getElementById('bottom-bar-quiz').classList.toggle('section-hidden', m !== 'quiz');
  }

    document.getElementById('quiz-drop').classList.remove('open');
    ['en-ja', 'ja-en', 'blank'].forEach(k => {
      document.getElementById('drop-' + k).classList.toggle('selected', k === t);
    });
    initQuiz();
    switchMode('quiz');
  }

  document.addEventListener('click', e => {
    if (!e.target.closest('#quiz-tab-wrap'))  document.getElementById('quiz-drop').classList.remove('open');
    if (!e.target.closest('#learn-tab-wrap')) document.getElementById('learn-drop').classList.remove('open');
  });

  // ─── Learn dropdown ───────────────────────────────────────────
  function toggleLearnDrop() {
    switchMode('learn');
    document.getElementById('learn-drop').classList.toggle('open');
  }

  function pickLearnMode(m) {
    learnMode = m;
    document.getElementById('learn-drop').classList.remove('open');
    ['random', 'seq'].forEach(k =>
      document.getElementById('drop-learn-' + k).classList.toggle('selected', k === m)
    );
    learnHistory = []; learnPtr = -1; learnSeqIdx = 0;
    switchMode('learn');
    m === 'random' ? goLearnNext() : (renderCard(), updateLearnNav());
  }

  // ─── Learning mode ────────────────────────────────────────────
  function setFilter(f, btn) {
    learnFilter = f;
    learnHistory = []; learnPtr = -1; learnSeqIdx = 0;
    document.querySelectorAll('#learn-section .filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    learnMode === 'random' ? goLearnNext() : (renderCard(), updateLearnNav());
  }

  function renderCard() {
    const deck = filtered(learnFilter);
    const item = learnMode === 'random' ? learnHistory[learnPtr] : deck[learnSeqIdx];
    if (!item) return;

    document.getElementById('learn-card').innerHTML = `
      <div class="card-header">
        <span class="card-type-badge ${item.type === 'word' ? 'badge-word' : 'badge-phrase'}">${item.type === 'word' ? '単語' : '熟語'}</span>
        <div class="freq-wrap">
          <span class="freq-label">使用頻度</span>
          <div class="freq-dots">${freqDots(item.freq)}</div>
        </div>
      </div>
      <div>
        <div class="card-en">${item.en}</div>
        ${item.phonetic ? `<div class="card-phonetic">${item.phonetic}</div>` : ''}
      </div>
      <div class="divider"></div>
      <div>
        <div class="card-pos">${item.pos}</div>
        <div class="card-ja">${item.ja}</div>
      </div>
      <div class="card-example">
        <div class="en">"${item.example.en}"</div>
        <div class="ja">${item.example.ja}</div>
      </div>
    `;

    const [cur, tot] = learnMode === 'random'
      ? [learnPtr + 1, learnHistory.length]
      : [learnSeqIdx + 1, deck.length];
    document.getElementById('card-counter').textContent = `${cur} / ${tot}`;
  }

  function goLearnNext() {
    if (learnMode === 'random') {
      const deck = filtered(learnFilter);
      const current = learnPtr >= 0 ? learnHistory[learnPtr] : null;
      const candidates = deck.length > 1 ? deck.filter(i => i !== current) : deck;
      const next = candidates[Math.floor(Math.random() * candidates.length)];
      learnHistory = learnHistory.slice(0, learnPtr + 1);
      learnHistory.push(next);
      learnPtr++;
    } else {
      const deck = filtered(learnFilter);
      learnSeqIdx = (learnSeqIdx + 1) % deck.length;
    }
    renderCard();
    updateLearnNav();
  }

  function navigateLearn(dir) {
    if (learnMode === 'random') {
      learnPtr += dir;
    } else {
      const deck = filtered(learnFilter);
      learnSeqIdx = (learnSeqIdx + dir + deck.length) % deck.length;
    }
    renderCard();
    updateLearnNav();
  }

  function updateLearnNav() {
    document.getElementById('learn-prev').disabled =
      learnMode === 'random' ? learnPtr <= 0 : false;
    document.getElementById('learn-next-nav').disabled =
      learnMode === 'random' ? learnPtr >= learnHistory.length - 1 : false;

    const nextBig = document.getElementById('learn-next-big');
    const bottomRow = document.querySelector('.learn-bottom-row');
    if (learnMode === 'seq') {
      nextBig.style.display = 'none';
      bottomRow.classList.add('seq-mode');
      document.getElementById('learn-prev').textContent = '◀ 前へ';
      document.getElementById('learn-next-nav').textContent = '次へ ▶';
    } else {
      nextBig.style.display = '';
      nextBig.textContent = '🔀 ランダム表示';
      bottomRow.classList.remove('seq-mode');
      document.getElementById('learn-prev').textContent = '◀ 戻る';
      document.getElementById('learn-next-nav').textContent = '進む ▶';
    }

    const jumpRow = document.getElementById('jump-row');
    if (learnMode === 'seq') {
      const deck = filtered(learnFilter);
      const inp = document.getElementById('jump-input');
      inp.max = deck.length;
      inp.value = learnSeqIdx + 1;
      jumpRow.style.display = 'flex';
    } else {
      jumpRow.style.display = 'none';
    }
  }

  function jumpToSeq() {
    const deck = filtered(learnFilter);
    const val = parseInt(document.getElementById('jump-input').value, 10);
    if (!isNaN(val) && val >= 1 && val <= deck.length) {
      learnSeqIdx = val - 1;
      renderCard();
      updateLearnNav();
    }
  }

  // ─── Quiz mode ────────────────────────────────────────────────
  function setQuizFilter(f, btn) {
    quizFilter = f;
    document.querySelectorAll('#quiz-section .filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    initQuiz();
  }

  function initQuiz() {
    quizHistory = []; quizPtr = -1;
    goQuizNext();
  }

  function goQuizNext() {
    const deck = filtered(quizFilter);
    const current = quizPtr >= 0 ? quizHistory[quizPtr] : null;
    const candidates = deck.length > 1 ? deck.filter(i => i !== current) : deck;
    const next = candidates[Math.floor(Math.random() * candidates.length)];
    quizHistory = quizHistory.slice(0, quizPtr + 1);
    quizHistory.push(next);
    quizPtr++;
    renderQuiz();
    updateQuizNav();
  }

  function navigateQuiz(dir) {
    quizPtr += dir;
    renderQuiz();
    updateQuizNav();
  }

  function updateQuizNav() {
    document.getElementById('quiz-prev').disabled    = quizPtr <= 0;
    document.getElementById('quiz-next-nav').disabled = quizPtr >= quizHistory.length - 1;
  }

  function renderQuiz() {
    if (quizPtr < 0) return;
    document.getElementById('flip-inner').classList.remove('flipped');

    const item = quizHistory[quizPtr];

    // Front header (badge + frequency)
    document.getElementById('quiz-card-header').innerHTML =
      `<span class="card-type-badge ${item.type === 'word' ? 'badge-word' : 'badge-phrase'}">${item.type === 'word' ? '単語' : '熟語'}</span>` +
      `<div class="freq-wrap"><span class="freq-label">使用頻度</span><div class="freq-dots">${freqDots(item.freq)}</div></div>`;

    // Front (question)
    const labelEl    = document.getElementById('quiz-label');
    const questionEl = document.getElementById('quiz-question');
    if (quizType === 'en-ja') {
      labelEl.textContent = '次の英語の意味を日本語で答えてください';
      questionEl.textContent = item.en;
    } else if (quizType === 'ja-en') {
      labelEl.textContent = '次の日本語に対応する英語を答えてください';
      questionEl.textContent = item.ja;
    } else {
      const regex = new RegExp(item.en.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi');
      const blanked = item.example.en.replace(regex, '<span class="blank">　　　　</span>');
      labelEl.textContent = '例文の空欄に当てはまる英語を答えてください';
      questionEl.innerHTML = blanked +
        `<div style="font-size:0.8rem;color:var(--text-muted);margin-top:8px;font-style:normal;">ヒント: ${item.ja}</div>`;
    }

    // Back (answer) — preloaded so flip is instant
    const main = document.getElementById('answer-main');
    const sub  = document.getElementById('answer-sub');
    if (quizType === 'en-ja') {
      main.textContent = item.ja;
      sub.textContent  = `例文: "${item.example.en}"`;
    } else if (quizType === 'ja-en') {
      main.textContent = item.en;
      sub.textContent  = `例文: "${item.example.en}"`;
    } else {
      main.textContent = item.en;
      sub.textContent  = item.example.en;
    }

    document.getElementById('quiz-counter').textContent = `${quizPtr + 1} / ${quizHistory.length}`;
  }

  function toggleFlip() {
    document.getElementById('flip-inner').classList.toggle('flipped');
  }

  // ─── Init ─────────────────────────────────────────────────────
  goLearnNext();

  // ─── Service Worker ───────────────────────────────────────────
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  }
</script>
</body>
</html>
