<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>英語学習</title>
  <style>
    :root {
      --primary: #818cf8;
      --primary-hover: #6366f1;
      --accent: #22d3ee;
      --bg: #0f172a;
      --surface: #1e293b;
      --surface2: #0d1424;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --border: #334155;
      --reveal-bg: #052e16;
      --reveal-border: #166534;
      --reveal-label: #4ade80;
      --radius: 10px;
      --shadow: 0 4px 20px rgba(0,0,0,0.5);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* ── Header ── */
    header {
      background: #1e293b;
      border-bottom: 1px solid var(--border);
      padding: 10px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    header h1 {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--text);
      white-space: nowrap;
    }

    .mode-tabs {
      display: flex;
      gap: 6px;
      margin-left: auto;
    }

    .mode-tab {
      padding: 6px 16px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text-muted);
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
    }

    .mode-tab.active {
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
    }

    .mode-tab:hover:not(.active) {
      border-color: var(--primary);
      color: var(--primary);
    }

    /* ── Main ── */
    main {
      max-width: 720px;
      margin: 0 auto;
      padding: 20px 16px;
    }

    /* ── Filter / type bars ── */
    .filter-bar, .quiz-type-bar {
      display: flex;
      gap: 6px;
      margin-bottom: 12px;
      justify-content: center;
      flex-wrap: nowrap;
    }

    .filter-btn {
      padding: 5px 16px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text-muted);
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
    }

    .filter-btn.active {
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
    }

    .quiz-type-btn {
      padding: 5px 14px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text-muted);
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
    }

    .quiz-type-btn.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #0f172a;
    }

    /* ── Nav row ── */
    .card-wrapper, .quiz-wrapper {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .nav-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .nav-btn {
      padding: 8px 16px;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-muted);
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
    }

    .nav-btn:hover {
      border-color: var(--primary);
      color: var(--primary);
    }

    .random-btn {
      padding: 8px 22px;
      border-radius: var(--radius);
      background: var(--primary);
      color: #fff;
      border: none;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
    }

    .random-btn:hover { background: var(--primary-hover); }
    .random-btn:active { transform: scale(0.98); }

    /* ── Learn card ── */
    .card {
      background: var(--surface);
      border-radius: 14px;
      box-shadow: var(--shadow);
      padding: 24px 28px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      animation: fadeIn 0.25s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(5px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .card-type-badge {
      display: inline-block;
      padding: 2px 10px;
      border-radius: 999px;
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.04em;
    }

    .badge-word   { background: #312e81; color: #a5b4fc; }
    .badge-phrase { background: #164e63; color: #67e8f9; }

    .card-en {
      font-size: 1.8rem;
      font-weight: 800;
      color: var(--primary);
      line-height: 1.2;
    }

    .card-phonetic {
      font-size: 0.88rem;
      color: var(--text-muted);
      font-style: italic;
      margin-top: 2px;
    }

    .divider { height: 1px; background: var(--border); }

    .card-pos  { font-size: 0.8rem; color: var(--text-muted); margin-bottom: 3px; }
    .card-ja   { font-size: 1.1rem; font-weight: 700; color: var(--text); }

    .card-example {
      background: var(--surface2);
      border-left: 3px solid var(--accent);
      border-radius: 0 8px 8px 0;
      padding: 10px 14px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .card-example .en { font-size: 0.88rem; color: var(--text); font-style: italic; }
    .card-example .ja { font-size: 0.82rem; color: var(--text-muted); }

    .card-counter {
      text-align: center;
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    /* ── Quiz card ── */
    .quiz-section { display: flex; flex-direction: column; gap: 0; }

    .quiz-card {
      background: var(--surface);
      border-radius: 14px;
      box-shadow: var(--shadow);
      padding: 24px 28px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      animation: fadeIn 0.25s ease;
    }

    .quiz-question-label {
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    .quiz-question {
      font-size: 1.4rem;
      font-weight: 800;
      color: var(--text);
      line-height: 1.35;
    }

    .quiz-question .blank {
      display: inline-block;
      min-width: 90px;
      border-bottom: 2px solid var(--primary);
      background: #1e2d4a;
      border-radius: 4px;
      padding: 0 8px;
      color: transparent;
    }

    .reveal-btn {
      align-self: flex-start;
      padding: 8px 20px;
      border-radius: var(--radius);
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-muted);
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .reveal-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .answer-reveal {
      background: var(--reveal-bg);
      border: 1px solid var(--reveal-border);
      border-radius: var(--radius);
      padding: 12px 16px;
      display: none;
      flex-direction: column;
      gap: 4px;
      animation: fadeIn 0.2s ease;
    }

    .answer-reveal.visible { display: flex; }

    .answer-reveal .label {
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--reveal-label);
    }

    .answer-reveal .answer-text {
      font-size: 1rem;
      font-weight: 700;
      color: var(--text);
    }

    .answer-reveal .answer-sub {
      font-size: 0.82rem;
      color: var(--text-muted);
      font-style: italic;
    }

    .quiz-counter {
      text-align: center;
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .section-hidden { display: none !important; }
  </style>
</head>
<body>

<header>
  <h1>📚 英語学習</h1>
  <div class="mode-tabs">
    <button class="mode-tab active" id="tab-learn" onclick="switchMode('learn')">学習モード</button>
    <button class="mode-tab" id="tab-quiz" onclick="switchMode('quiz')">クイズモード</button>
  </div>
</header>

<main>

  <!-- ─── LEARNING MODE ─── -->
  <section id="learn-section">
    <div class="filter-bar">
      <button class="filter-btn active" onclick="setFilter('all', this)">すべて</button>
      <button class="filter-btn" onclick="setFilter('word', this)">単語</button>
      <button class="filter-btn" onclick="setFilter('phrase', this)">熟語</button>
    </div>

    <div class="card-wrapper">
      <div class="nav-row">
        <button class="nav-btn" onclick="navigate(-1)">◀ 前へ</button>
        <button class="random-btn" onclick="goRandom()">🔀 ランダム</button>
        <button class="nav-btn" onclick="navigate(1)">次へ ▶</button>
      </div>

      <div class="card" id="learn-card"></div>
      <div class="card-counter" id="card-counter"></div>
    </div>
  </section>

  <!-- ─── QUIZ MODE ─── -->
  <section id="quiz-section" class="section-hidden quiz-section">
    <div class="filter-bar">
      <button class="filter-btn active" onclick="setQuizFilter('all', this)">すべて</button>
      <button class="filter-btn" onclick="setQuizFilter('word', this)">単語</button>
      <button class="filter-btn" onclick="setQuizFilter('phrase', this)">熟語</button>
    </div>

    <div class="quiz-type-bar">
      <button class="quiz-type-btn active" onclick="setQuizType('en-ja', this)">英語 → 日本語</button>
      <button class="quiz-type-btn" onclick="setQuizType('ja-en', this)">日本語 → 英語</button>
      <button class="quiz-type-btn" onclick="setQuizType('blank', this)">穴あき問題</button>
    </div>

    <div class="quiz-wrapper">
      <div class="nav-row">
        <button class="nav-btn" onclick="navigateQuiz(-1)">◀ 前へ</button>
        <button class="random-btn" onclick="goQuizRandom()">🔀 ランダム</button>
        <button class="nav-btn" onclick="navigateQuiz(1)">次へ ▶</button>
      </div>

      <div class="quiz-card">
        <div>
          <div class="quiz-question-label" id="quiz-label"></div>
          <div class="quiz-question" id="quiz-question"></div>
        </div>
        <button class="reveal-btn" onclick="revealAnswer()">💡 答えを確認</button>
        <div class="answer-reveal" id="answer-reveal">
          <div class="label">正解</div>
          <div class="answer-text" id="answer-main"></div>
          <div class="answer-sub" id="answer-sub"></div>
        </div>
      </div>

      <div class="quiz-counter" id="quiz-counter"></div>
    </div>
  </section>

</main>

<script>
  const words = [
    { type:'word', en:'eloquent', phonetic:'/ˈɛləkwənt/', pos:'形容詞', ja:'雄弁な、説得力のある',
      example:{ en:'She gave an eloquent speech that moved the entire audience.', ja:'彼女は聴衆全員を感動させる雄弁なスピーチをした。' } },
    { type:'word', en:'perseverance', phonetic:'/ˌpɜːrsɪˈvɪərəns/', pos:'名詞', ja:'忍耐力、粘り強さ',
      example:{ en:'His perseverance helped him overcome every obstacle.', ja:'彼の忍耐力はあらゆる障害を乗り越える助けになった。' } },
    { type:'word', en:'ambiguous', phonetic:'/æmˈbɪɡjuəs/', pos:'形容詞', ja:'曖昧な、多義的な',
      example:{ en:'The instructions were ambiguous and hard to follow.', ja:'説明が曖昧でわかりにくかった。' } },
    { type:'word', en:'meticulous', phonetic:'/mɪˈtɪkjʊləs/', pos:'形容詞', ja:'細心の、几帳面な',
      example:{ en:'She is meticulous about checking every detail of her work.', ja:'彼女は仕事の細部まで細心の注意を払って確認する。' } },
    { type:'word', en:'resilient', phonetic:'/rɪˈzɪliənt/', pos:'形容詞', ja:'回復力のある、しなやかな',
      example:{ en:'Children are often more resilient than we expect.', ja:'子どもたちは私たちが思う以上に回復力がある。' } },
    { type:'word', en:'pragmatic', phonetic:'/præɡˈmætɪk/', pos:'形容詞', ja:'実用的な、現実的な',
      example:{ en:'We need a pragmatic solution, not an idealistic one.', ja:'理想的ではなく現実的な解決策が必要だ。' } },
    { type:'word', en:'ephemeral', phonetic:'/ɪˈfɛmərəl/', pos:'形容詞', ja:'はかない、短命の',
      example:{ en:'Fame can be ephemeral in the age of social media.', ja:'SNS時代において名声ははかないものかもしれない。' } },
    { type:'word', en:'benevolent', phonetic:'/bɪˈnɛvələnt/', pos:'形容詞', ja:'慈悲深い、善意の',
      example:{ en:'The benevolent donor funded the entire school library.', ja:'慈悲深い寄付者が学校図書館全体に資金を提供した。' } },
    { type:'word', en:'profound', phonetic:'/prəˈfaʊnd/', pos:'形容詞', ja:'深遠な、非常に大きな',
      example:{ en:'The experience had a profound effect on her life.', ja:'その経験は彼女の人生に深遠な影響を与えた。' } },
    { type:'word', en:'tenacious', phonetic:'/tɪˈneɪʃəs/', pos:'形容詞', ja:'粘り強い、固執する',
      example:{ en:'The tenacious athlete never gave up, even after losing.', ja:'粘り強いアスリートは負けた後でも決して諦めなかった。' } },
    { type:'phrase', en:'break the ice', pos:'慣用句', ja:'緊張をほぐす、話のきっかけを作る',
      example:{ en:'He told a joke to break the ice at the meeting.', ja:'彼は会議の緊張をほぐすためにジョークを言った。' } },
    { type:'phrase', en:'hit the nail on the head', pos:'慣用句', ja:'核心をつく、的を射る',
      example:{ en:'You really hit the nail on the head with that analysis.', ja:'そのご分析はまさに核心をついていますね。' } },
    { type:'phrase', en:'bite the bullet', pos:'慣用句', ja:'歯を食いしばって耐える、腹をくくる',
      example:{ en:'I decided to bite the bullet and visit the dentist.', ja:'腹をくくって歯医者に行くことにした。' } },
    { type:'phrase', en:'spill the beans', pos:'慣用句', ja:'秘密を漏らす、うっかり話してしまう',
      example:{ en:"Don't spill the beans about the surprise party!", ja:'サプライズパーティーのことを漏らさないで！' } },
    { type:'phrase', en:'once in a blue moon', pos:'慣用句', ja:'めったにない、ごくたまに',
      example:{ en:'She only visits her hometown once in a blue moon.', ja:'彼女はめったに故郷に帰らない。' } },
    { type:'phrase', en:'cost an arm and a leg', pos:'慣用句', ja:'非常に高価、目が飛び出るほど高い',
      example:{ en:'That new smartphone costs an arm and a leg.', ja:'その新しいスマートフォンはとても高価だ。' } },
    { type:'phrase', en:'the ball is in your court', pos:'慣用句', ja:'あなた次第だ、あなたが決める番だ',
      example:{ en:"I've made my offer — the ball is in your court now.", ja:'私はオファーをした。あとはあなた次第だ。' } },
    { type:'phrase', en:'kill two birds with one stone', pos:'慣用句', ja:'一石二鳥',
      example:{ en:'I combined my commute with a podcast — killing two birds with one stone.', ja:'通勤中にポッドキャストを聴いて一石二鳥にした。' } },
    { type:'phrase', en:'under the weather', pos:'慣用句', ja:'体調が悪い、気分が優れない',
      example:{ en:"I'm feeling a bit under the weather today.", ja:'今日は少し体調が悪い。' } },
    { type:'phrase', en:'burn the midnight oil', pos:'慣用句', ja:'夜遅くまで働く、徹夜で勉強する',
      example:{ en:'She burned the midnight oil to finish the report on time.', ja:'彼女はレポートを間に合わせるために夜遅くまで働いた。' } }
  ];

  let mode = 'learn';
  let learnFilter = 'all', learnIndex = 0, learnDeck = [];
  let quizFilter = 'all', quizType = 'en-ja', quizDeck = [], quizIndex = 0;

  function filtered(f) { return f === 'all' ? words : words.filter(w => w.type === f); }

  function shuffled(arr) {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function switchMode(m) {
    mode = m;
    document.getElementById('learn-section').classList.toggle('section-hidden', m !== 'learn');
    document.getElementById('quiz-section').classList.toggle('section-hidden', m !== 'quiz');
    document.getElementById('tab-learn').classList.toggle('active', m === 'learn');
    document.getElementById('tab-quiz').classList.toggle('active', m === 'quiz');
    if (m === 'quiz') initQuiz();
  }

  // ── Learn ──
  function setFilter(f, btn) {
    learnFilter = f;
    learnDeck = filtered(f);
    learnIndex = 0;
    document.querySelectorAll('#learn-section .filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    renderCard();
  }

  function renderCard() {
    const item = learnDeck[learnIndex];
    document.getElementById('learn-card').innerHTML = `
      <div><span class="card-type-badge ${item.type === 'word' ? 'badge-word' : 'badge-phrase'}">${item.type === 'word' ? '単語' : '熟語'}</span></div>
      <div>
        <div class="card-en">${item.en}</div>
        ${item.phonetic ? `<div class="card-phonetic">${item.phonetic}</div>` : ''}
      </div>
      <div class="divider"></div>
      <div>
        <div class="card-pos">${item.pos}</div>
        <div class="card-ja">${item.ja}</div>
      </div>
      <div class="card-example">
        <div class="en">"${item.example.en}"</div>
        <div class="ja">${item.example.ja}</div>
      </div>
    `;
    document.getElementById('card-counter').textContent = `${learnIndex + 1} / ${learnDeck.length}`;
  }

  function navigate(dir) {
    learnIndex = (learnIndex + dir + learnDeck.length) % learnDeck.length;
    renderCard();
  }

  function goRandom() {
    let next;
    do { next = Math.floor(Math.random() * learnDeck.length); }
    while (learnDeck.length > 1 && next === learnIndex);
    learnIndex = next;
    renderCard();
  }

  // ── Quiz ──
  function setQuizFilter(f, btn) {
    quizFilter = f;
    document.querySelectorAll('#quiz-section .filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    initQuiz();
  }

  function setQuizType(t, btn) {
    quizType = t;
    document.querySelectorAll('.quiz-type-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    initQuiz();
  }

  function initQuiz() {
    quizDeck = shuffled(filtered(quizFilter));
    quizIndex = 0;
    renderQuiz();
  }

  function renderQuiz() {
    const item = quizDeck[quizIndex % quizDeck.length];
    document.getElementById('answer-reveal').classList.remove('visible');

    const labelEl = document.getElementById('quiz-label');
    const questionEl = document.getElementById('quiz-question');

    if (quizType === 'en-ja') {
      labelEl.textContent = '次の英語の意味を日本語で答えてください';
      questionEl.textContent = item.en;
    } else if (quizType === 'ja-en') {
      labelEl.textContent = '次の日本語に対応する英語を答えてください';
      questionEl.textContent = item.ja;
    } else {
      const regex = new RegExp(item.en.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi');
      const blanked = item.example.en.replace(regex, '<span class="blank">　　　　</span>');
      labelEl.textContent = '例文の空欄に当てはまる英語を答えてください';
      questionEl.innerHTML = blanked +
        `<div style="font-size:0.82rem;color:var(--text-muted);margin-top:8px;font-style:normal;">ヒント: ${item.ja}</div>`;
    }
    document.getElementById('quiz-counter').textContent = `${quizIndex + 1} / ${quizDeck.length}`;
  }

  function navigateQuiz(dir) {
    quizIndex = (quizIndex + dir + quizDeck.length) % quizDeck.length;
    renderQuiz();
  }

  function goQuizRandom() {
    let next;
    do { next = Math.floor(Math.random() * quizDeck.length); }
    while (quizDeck.length > 1 && next === quizIndex);
    quizIndex = next;
    renderQuiz();
  }

  function revealAnswer() {
    const item = quizDeck[quizIndex % quizDeck.length];
    const main = document.getElementById('answer-main');
    const sub = document.getElementById('answer-sub');
    if (quizType === 'en-ja') {
      main.textContent = item.ja;
      sub.textContent = `例文: "${item.example.en}"`;
    } else if (quizType === 'ja-en') {
      main.textContent = item.en;
      sub.textContent = `例文: "${item.example.en}"`;
    } else {
      main.textContent = item.en;
      sub.textContent = item.example.en;
    }
    document.getElementById('answer-reveal').classList.add('visible');
  }

  // Init
  learnDeck = filtered('all');
  renderCard();
</script>
</body>
</html>
